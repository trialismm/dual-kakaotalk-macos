name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./Scripts/verify-no-kakao-assets.sh
      - run: ./Scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dual-KakaoTalk-for-macOS
          path: dist/Dual-KakaoTalk-for-macOS-v0.1.0-beta.1.zip
