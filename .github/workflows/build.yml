name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift test
      - run: ./Scripts/verify-no-kakao-assets.sh
      - run: ./Scripts/build-release.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Dual-KakaoTalk-for-macOS
          path: |
            dist/Dual-KakaoTalk-for-macOS-v0.1.0-beta.2.zip
            dist/Dual-KakaoTalk-for-macOS-v0.1.0-beta.2.zip.manifest.json
          if-no-files-found: error
