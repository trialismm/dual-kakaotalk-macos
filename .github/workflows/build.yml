name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: swift test
      - run: ./Scripts/verify-no-kakao-assets.sh
      - run: ./Scripts/build-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dual-KakaoTalk-for-macOS
          path: |
            dist/Dual-KakaoTalk-for-macOS-v0.1.0-beta.2.zip
            dist/Dual-KakaoTalk-for-macOS-v0.1.0-beta.2.zip.manifest.json
          if-no-files-found: error
